description:
  text: >-
    The Imitation of Christ is a devotional manual on the interior life,
    written in Latin in the early fifteenth century and traditionally
    attributed to Thomas à Kempis. It is divided into four books: on the
    spiritual life, on the inner life, on inward consolation, and on the
    sacrament of the altar. This translation is by William Benham.
