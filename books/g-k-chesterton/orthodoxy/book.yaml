description:
  text: >-
    Orthodoxy is a work of Christian apologetics written as a personal
    intellectual history. Chesterton published it in 1908 as a companion to
    Heretics, after critics complained that the earlier book attacked current
    philosophies without offering one of its own. It has a preface and nine
    chapters.
